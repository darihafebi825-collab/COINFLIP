<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indian Coin Flip - 1 Rupee</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }

        .container {
            text-align: center;
            max-width: 600px;
            width: 100%;
        }

        .coin-container {
            perspective: 1000px;
            height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 40px 0;
        }

        .coin {
            width: 200px;
            height: 200px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.1s;
        }

        .coin.flipping {
            animation: coinFlip 2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        @keyframes coinFlip {
            0% {
                transform: translateY(0) rotateY(0deg) rotateX(0deg);
            }
            25% {
                transform: translateY(-100px) rotateY(900deg) rotateX(450deg);
            }
            50% {
                transform: translateY(-80px) rotateY(1800deg) rotateX(900deg);
            }
            75% {
                transform: translateY(-40px) rotateY(2700deg) rotateX(1350deg);
            }
            100% {
                transform: translateY(0) rotateY(3600deg) rotateX(1800deg);
            }
        }

        .coin-face {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 
                0 5px 25px rgba(0,0,0,0.3),
                inset 0 2px 5px rgba(255,255,255,0.5),
                inset 0 -2px 5px rgba(0,0,0,0.2);
            border: 6px solid #a8a8a8;
        }

        /* Heads side - Ashoka Lion Capital */
        .heads {
            background: radial-gradient(circle at 35% 35%, #e8e8e8, #c0c0c0, #989898);
            transform: rotateY(0deg) translateZ(2px);
        }

        .heads-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #2c2c2c;
            text-shadow: 1px 1px 1px rgba(255,255,255,0.3);
        }

        .ashoka-pillar {
            font-size: 4rem;
            margin-bottom: 10px;
            filter: drop-shadow(1px 1px 2px rgba(0,0,0,0.4));
        }

        .india-text {
            font-weight: bold;
            font-size: 1.2rem;
            letter-spacing: 2px;
        }

        .hindi-text {
            font-size: 1.5rem;
            margin-top: 5px;
        }

        /* Tails side - One Rupee */
        .tails {
            background: radial-gradient(circle at 35% 35%, #e8e8e8, #c0c0c0, #989898);
            transform: rotateY(180deg) translateZ(2px);
        }

        .tails-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #2c2c2c;
            text-shadow: 1px 1px 1px rgba(255,255,255,0.3);
        }

        .rupee-symbol {
            font-size: 5rem;
            font-weight: bold;
            margin-bottom: 10px;
            filter: drop-shadow(1px 1px 2px rgba(0,0,0,0.4));
        }

        .denomination {
            font-size: 2rem;
            font-weight: bold;
            margin-top: 10px;
        }

        .coin-edge {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: linear-gradient(90deg, 
                #7a7a7a 0%, 
                #b8b8b8 25%, 
                #d8d8d8 50%, 
                #b8b8b8 75%, 
                #7a7a7a 100%);
            transform: translateZ(-2px);
        }

        .flip-button {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            font-size: 1.5rem;
            font-weight: bold;
            padding: 20px 60px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 40px;
        }

        .flip-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
        }

        .flip-button:active {
            transform: translateY(-1px);
        }

        .flip-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .coin-shadow {
            position: absolute;
            bottom: -20px;
            width: 200px;
            height: 20px;
            background: radial-gradient(ellipse, rgba(0,0,0,0.4), transparent);
            border-radius: 50%;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .coin:not(.flipping) ~ .coin-shadow {
            opacity: 1;
        }

        @media (max-width: 768px) {
            .coin {
                width: 150px;
                height: 150px;
            }

            .ashoka-pillar {
                font-size: 3rem;
            }

            .rupee-symbol {
                font-size: 4rem;
            }

            .flip-button {
                padding: 15px 40px;
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="coin-container">
            <div class="coin" id="coin">
                <div class="coin-face heads">
                    <div class="heads-content">
                        <div class="ashoka-pillar">🦁</div>
                        <div class="india-text">INDIA</div>
                        <div class="hindi-text">भारत</div>
                    </div>
                </div>
                <div class="coin-face tails">
                    <div class="tails-content">
                        <div class="rupee-symbol">₹</div>
                        <div class="denomination">1</div>
                    </div>
                </div>
                <div class="coin-edge"></div>
            </div>
            <div class="coin-shadow"></div>
        </div>

        <button class="flip-button" id="flipButton" onclick="flipCoin()">
            Flip Coin
        </button>
    </div>

    <script>
        let isFlipping = false;

        function flipCoin() {
            if (isFlipping) return;

            const coin = document.getElementById('coin');
            const flipButton = document.getElementById('flipButton');

            isFlipping = true;
            flipButton.disabled = true;

            // Add flipping animation
            coin.classList.add('flipping');

            // Determine result
            const isHeads = Math.random() < 0.5;
            const spins = Math.floor(Math.random() * 4) + 5; // 5-8 spins
            const finalRotation = isHeads ? (spins * 360) : (spins * 360 + 180);

            // After animation completes
            setTimeout(() => {
                coin.classList.remove('flipping');
                
                // Set final position
                coin.style.transform = `rotateY(${finalRotation}deg)`;

                isFlipping = false;
                flipButton.disabled = false;
            }, 2000);
        }

        // Keyboard support - press Space to flip
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && !isFlipping) {
                e.preventDefault();
                flipCoin();
            }
        });

        // Touch support for mobile
        let touchStartY = 0;
        document.addEventListener('touchstart', (e) => {
            touchStartY = e.touches[0].clientY;
        });

        document.addEventListener('touchend', (e) => {
            const touchEndY = e.changedTouches[0].clientY;
            const swipeDistance = touchStartY - touchEndY;
            
            // Swipe up to flip
            if (swipeDistance > 50 && !isFlipping) {
                flipCoin();
            }
        });
    </script>
</body>
</html>
